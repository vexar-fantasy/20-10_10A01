      - "3001:3000"

  greeting-calang:
    build: ./calang
    container_name: greeting-calang
    restart: unless-stopped
    ports:
      - "3002:3000"

  greeting-chick1:
    build: ./chick1
    container_name: greeting-chick1
    restart: unless-stopped
    ports:
      - "3003:3000"

  greeting-chick2:
    build: ./chick2
    container_name: greeting-chick2
